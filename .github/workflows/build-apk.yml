name: Compiler la calculatrice Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'CalculatriceScientifiqueAndroid.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Extraire le projet Android
        run: |
          unzip -q CalculatriceScientifiqueAndroid.zip -d android-project
          test -f android-project/app/build.gradle

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compiler l'APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.7'
          arguments: -p android-project assembleDebug

      - name: Publier le fichier APK
        uses: actions/upload-artifact@v4
        with:
          name: CalculatriceScientifique-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
